version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=dev-secret-key
      - FLASK_DEBUG=0
    volumes:
      - ./disease_model.pkl:/app/disease_model.pkl
      - ./symptoms_list.json:/app/symptoms_list.json

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend
